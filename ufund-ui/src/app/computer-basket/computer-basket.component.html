<h2>{{user?.name}}'s Computer Basket </h2>
<div>
    <button *ngFor="let computer of computers">
      {{computer.name}}
    </button>
</div>
<h2 id="result">Computer Cupboard</h2>
<div>
    <button *ngFor="let computer of allComputers"
     (click)="addComputer(computer.id)" >
        {{computer.name}}
    </button>
</div>
